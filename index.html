<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HTML Form</title>
	<style>
		.success-page {
			max-width: 26rem;
			margin: 3rem auto;
			padding: 2rem;
			border: 1px solid #c9ddd2;
			border-radius: 8px;
			background: #f5faf7;
			text-align: center;
		}

		.success-page h2 {
			color: #176b4d;
		}

		.success-mark {
			margin: 0;
			color: #176b4d;
			font-size: 2.5rem;
		}
	</style>
</head>
<body>
	<main>
		<h1 id="page-title">Registration Form</h1>

		<form id="registration-form" action="#" method="post">
			<p>
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" required>
			</p>

			<p>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required>
			</p>

			<fieldset>
				<legend>Select gender</legend>
				<label>
					<input type="radio" name="gender" value="male" required>
					Male
				</label>
				<label>
					<input type="radio" name="gender" value="female">
					Female
				</label>
				<label>
					<input type="radio" name="gender" value="other">
					Other
				</label>
			</fieldset>

			<fieldset>
				<legend>Select course</legend>
				<label>
					<input type="checkbox" name="course" value="html">
					HTML
				</label>
				<label>
					<input type="checkbox" name="course" value="css">
					CSS
				</label>
				<label>
					<input type="checkbox" name="course" value="javascript">
					JavaScript
				</label>
                <label>
                    <input type="checkbox" name="course" value="python">
                    Python
                </label>
			</fieldset>

			<p>
				<label for="date-of-birth">Choose your date of birth:</label>
				<input type="date" id="date-of-birth" name="date-of-birth" lang="en-GB">
			</p>

			<p>
				<label for="country">Select country:</label>
				<select id="country" name="country" required>
					<option value="">Choose a country</option>
					<option value="india">India</option>
					<option value="united-states">United States</option>
					<option value="united-kingdom">United Kingdom</option>
					<option value="canada">Canada</option>
					<option value="australia">Australia</option>
				</select>
			</p>

            <p>
				<label for="file">Choose file:</label>
				<input type="file" id="file" name="file">
			</p>

            <p><button type="submit">Submit</button></p>

		</form>

		<section id="success-message" class="success-page" hidden aria-live="polite">
			<p class="success-mark" aria-hidden="true">&#10003;</p>
			<h2>Registration Successful!</h2>
			<p>Thank you, <span id="registered-username"></span>. Your registration has been completed successfully.</p>
		</section>
	</main>

	<script>
		const registrationForm = document.getElementById('registration-form');
		const successMessage = document.getElementById('success-message');
		const registeredUsername = document.getElementById('registered-username');
		const pageTitle = document.getElementById('page-title');

		registrationForm.addEventListener('submit', (event) => {
			event.preventDefault();
			registeredUsername.textContent = registrationForm.elements.username.value;
			registrationForm.hidden = true;
			pageTitle.hidden = true;
			successMessage.hidden = false;
			document.title = 'Registration Successful';
		});
	</script>
</body>
</html>
